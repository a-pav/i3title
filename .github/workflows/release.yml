name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: make build

      - name: Package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          tar -C dist \
            -czf "dist/i3title-${VERSION}-linux-${{ matrix.arch }}.tar.gz" \
            i3title i3toast

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: i3title-linux-${{ matrix.arch }}
          path: dist/*.tar.gz

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: i3title-linux-*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" \
            dist/*.tar.gz \
            --title "$VERSION" \
            --generate-notes
